x-service-env: &service-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: task_management
  DB_USERNAME: task_management
  DB_PASSWORD: secret
  CACHE_STORE: redis
  REDIS_HOST: redis

x-depends-on: &depends-on
  mysql:
    condition: service_healthy
  redis:
    condition: service_started

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - .env
    environment: *service-env
    depends_on: *depends-on

  queue:
    build: .
    command: php artisan queue:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - .env
    environment: *service-env
    depends_on: *depends-on

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: task_management
      MYSQL_USER: task_management
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  vendor:
  mysql:
